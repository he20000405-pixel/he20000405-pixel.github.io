<aside class="reading-rail" data-reading-rail hidden aria-label="{% if page.lang == 'en' %}Page navigation{% else %}页面导航{% endif %}">
  <details class="rail-panel toc-panel" data-page-toc open>
    <summary>{% if page.lang == 'en' %}On this page{% else %}本页目录{% endif %}</summary>
    <ol class="toc-list" data-toc-list></ol>
  </details>
  <section class="rail-panel discovery-panel">
    <p class="rail-label">{% if page.lang == 'en' %}Find another answer{% else %}继续查找答案{% endif %}</p>
    <a class="rail-primary-link" href="{{ '/search/' | relative_url }}">{% if page.lang == 'en' %}Search all guides{% else %}搜索全部指南{% endif %} →</a>
    <a href="{{ '/resources/' | relative_url }}">{% if page.lang == 'en' %}Practical resources{% else %}实用资源{% endif %} →</a>
  </section>
</aside>
