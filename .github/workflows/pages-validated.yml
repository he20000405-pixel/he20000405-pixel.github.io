name: Validate and publish knowledge base (hardened)

on:
  push:
    branches: [main, 'ci-check/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and validate all five sites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      current_alias: ${{ steps.build.outputs.current_alias }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: sources/${{ github.event.repository.name }}
          persist-credentials: false
      - name: Set up Node for existing search tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build candidate and dependency snapshots
        id: build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: python3 "sources/$CURRENT_NAME/.github/scripts/build_sites.py" --repository "$CURRENT_REPOSITORY" --expected-sha "$CANDIDATE_SHA"
      - name: Test that the validator rejects broken fixtures
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: python3 "sources/$CURRENT_NAME/.github/scripts/test_check_site.py"
      - name: Validate links, search index and page metadata
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: python3 "sources/$CURRENT_NAME/.github/scripts/check_site.py" --build-root build --report evidence/site-check.json
      - name: Run the existing search behavior tests
        run: node sources/he20000405-pixel.github.io/scripts/test_search.cjs
      - name: Test the built search acceptance checks
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: node "sources/$CURRENT_NAME/.github/scripts/test_built_search.cjs" --build-root build
      - name: Verify search on the actual generated page and index
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: node "sources/$CURRENT_NAME/.github/scripts/check_built_search.cjs" --build-root build --report evidence/built-search.json
      - name: Test stale and unavailable release-head rejection
        env:
          CURRENT_NAME: ${{ github.event.repository.name }}
        run: python3 "sources/$CURRENT_NAME/.github/scripts/test_release_head.py"
      - name: Save validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Package only the validated candidate site
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/${{ steps.build.outputs.current_alias }}

  release-ready:
    name: Verify the release dependency gate
    needs: verify
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo 'All checks passed. Only main is eligible to deploy this artifact.'

  deploy:
    name: Deploy the validated site
    needs: [verify, release-ready]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the validated candidate's deployment guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: gate-source
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Confirm this candidate is still the latest main
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: python3 gate-source/.github/scripts/check_release_head.py --repository "$CURRENT_REPOSITORY" --candidate-sha "$CANDIDATE_SHA" --report release-evidence/head-check.json
      - name: Deploy the artifact from this successful run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Save release-head evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-head-evidence
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30
